    <style>
      :root {
        --bg-deep: #060b16;
        --bg-panel: #0d1627;
        --ink: #edf7ff;
        --muted: #8fa4b8;
        --brand: #27d7ff;
        --brand-strong: #00a7d6;
        --accent: #65f6bd;
        --card: rgba(13, 25, 43, 0.88);
        --border: rgba(119, 213, 255, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family: "Space Grotesk", sans-serif;
        background:
          radial-gradient(circle at 8% 8%, rgba(0, 167, 214, 0.2), transparent 28%),
          radial-gradient(circle at 92% 18%, rgba(101, 246, 189, 0.12), transparent 30%),
          linear-gradient(145deg, #070d1b 0%, #091323 48%, #050913 100%);
        min-height: 100vh;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(92, 182, 232, 0.045) 1px, transparent 1px),
          linear-gradient(90deg, rgba(92, 182, 232, 0.045) 1px, transparent 1px);
        background-size: 36px 36px;
        opacity: 0.55;
      }

      h1, h2, h3, h4, h5 {
        font-family: "Space Grotesk", sans-serif;
        letter-spacing: -0.02em;
      }

      .navbar {
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(16px);
        background: rgba(5, 11, 23, 0.9) !important;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.24);
      }

      .navbar-brand {
        font-family: "IBM Plex Mono", monospace;
        font-size: 1.3rem;
        color: var(--brand) !important;
        letter-spacing: -0.08em;
      }

      .navbar .nav-link {
        color: rgba(237, 247, 255, 0.72) !important;
        font-size: 0.92rem;
        border-radius: 999px;
        padding: 0.35rem 0.72rem !important;
        transition: all 0.25s ease;
      }

      .navbar .nav-link:hover {
        color: var(--brand) !important;
        background: rgba(39, 215, 255, 0.1);
      }

      main.container {
        padding-top: 5.9rem;
        padding-bottom: 2.5rem;
        position: relative;
        z-index: 1;
      }

      .hero-panel,
      .tool-panel,
      .result-panel,
      .card {
        border: 1px solid var(--border);
        border-radius: 1.15rem;
        background: var(--card);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(12px);
      }

      .hero-panel,
      .tool-panel,
      .result-panel {
        padding: 1.9rem;
      }

      .hero-panel {
        background:
          linear-gradient(120deg, rgba(0, 167, 214, 0.12), rgba(101, 246, 189, 0.08)),
          var(--card);
      }

      .eyebrow {
        display: inline-block;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.74rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 0.85rem;
      }

      .hero-title {
        font-size: clamp(2rem, 2.8vw, 2.8rem);
        line-height: 1.12;
        margin-bottom: 0.8rem;
      }

      .hero-copy {
        color: var(--muted);
        font-size: 1.04rem;
        max-width: 66ch;
      }

      .card {
        transition: transform 0.25s ease, box-shadow 0.25s ease;
        overflow: hidden;
      }

      .card:hover {
        transform: translateY(-6px);
        border-color: rgba(39, 215, 255, 0.48);
        box-shadow: 0 22px 42px rgba(0, 0, 0, 0.42), 0 0 24px rgba(39, 215, 255, 0.08);
      }

      .card .card-header {
        font-weight: 700;
        border-bottom: 1px solid var(--border);
        background: rgba(39, 215, 255, 0.06);
        color: var(--brand);
      }

      .card .card-body {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .card-title {
        margin: 0;
      }

      .card-text {
        color: var(--muted);
      }

      .btn,
      .btn-primary,
      .btn-outline-primary {
        border-radius: 999px;
        font-weight: 700;
        border: 0;
        letter-spacing: 0.02em;
      }

      .btn-primary {
        color: #04111d;
        background: linear-gradient(125deg, var(--brand), var(--accent));
        box-shadow: 0 12px 24px rgba(39, 215, 255, 0.2);
      }

      .btn-primary:hover {
        color: #04111d;
        background: linear-gradient(125deg, #75e9ff, #8affcf);
        transform: translateY(-1px);
      }

      .form-label {
        font-weight: 700;
      }

      .form-control {
        border-radius: 0.85rem;
        border: 1px solid rgba(119, 213, 255, 0.22);
        background: rgba(4, 12, 26, 0.8);
        color: var(--ink);
        padding: 0.72rem 0.82rem;
      }

      .form-control::placeholder {
        color: #657d92;
      }

      .form-control:focus {
        border-color: rgba(39, 215, 255, 0.7);
        background: rgba(4, 12, 26, 0.95);
        color: var(--ink);
        box-shadow: 0 0 0 0.25rem rgba(39, 215, 255, 0.14);
      }

      .form-text,
      .muted-note {
        color: var(--muted);
      }

      .result-title {
        color: var(--brand);
        margin-bottom: 0.65rem;
      }

      .result-body {
        margin: 0;
        line-height: 1.7;
        color: #d7e8f4;
        white-space: pre-wrap;
      }

      .result-body.markdown-output {
        white-space: normal;
      }

      .result-body.markdown-output p {
        margin-bottom: 0.8rem;
      }

      .result-body.markdown-output ul,
      .result-body.markdown-output ol {
        margin: 0.35rem 0 1rem;
        padding-left: 1.35rem;
      }

      .result-body.markdown-output li {
        margin-bottom: 0.32rem;
        line-height: 1.58;
      }

      .result-body.markdown-output li > p {
        margin: 0;
      }

      .result-body.markdown-output strong {
        font-weight: 700;
        color: var(--accent);
      }

      .result-body.markdown-output h1,
      .result-body.markdown-output h2,
      .result-body.markdown-output h3 {
        margin-top: 1rem;
        margin-bottom: 0.55rem;
        font-size: 1.15rem;
        color: var(--brand);
      }

      .result-body.markdown-output h2 {
        font-size: 1.2rem;
      }

      .result-body.markdown-output h3 {
        font-size: 1.08rem;
      }

      .result-body.markdown-output table {
        width: 100%;
        border-collapse: collapse;
        margin: 0.6rem 0 1.1rem;
        border: 1px solid var(--border);
        border-radius: 0.6rem;
        overflow: hidden;
      }

      .result-body.markdown-output th,
      .result-body.markdown-output td {
        border: 1px solid rgba(119, 213, 255, 0.12);
        padding: 0.5rem 0.62rem;
        text-align: left;
        vertical-align: top;
      }

      .result-body.markdown-output th {
        background: rgba(39, 215, 255, 0.08);
        font-weight: 700;
      }

      .result-body.markdown-output hr {
        border: 0;
        border-top: 1px solid var(--border);
        margin: 1.1rem 0;
      }

      .placeholder-result {
        margin: 0;
        color: var(--muted);
      }

      .site-footer {
        position: relative;
        z-index: 1;
        color: #637d94;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
      }

      .reveal-up {
        animation: revealUp 0.55s ease forwards;
      }

      .card-grid .col-lg-4,
      .card-grid .col-md-6,
      .card-grid .col-lg-3 {
        animation: revealUp 0.6s ease both;
      }

      .card-grid .col-lg-4:nth-child(2),
      .card-grid .col-md-6:nth-child(2),
      .card-grid .col-lg-3:nth-child(2) {
        animation-delay: 0.05s;
      }

      .card-grid .col-lg-4:nth-child(3),
      .card-grid .col-md-6:nth-child(3),
      .card-grid .col-lg-3:nth-child(3) {
        animation-delay: 0.1s;
      }

      .card-grid .col-lg-4:nth-child(4),
      .card-grid .col-md-6:nth-child(4),
      .card-grid .col-lg-3:nth-child(4) {
        animation-delay: 0.15s;
      }

      @keyframes revealUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 991px) {
        .navbar .nav-link {
          margin-bottom: 0.3rem;
        }

        main.container {
          padding-top: 5.4rem;
        }
      }

      @media (max-width: 576px) {
        .hero-panel,
        .tool-panel,
        .result-panel {
          padding: 1.35rem;
          border-radius: 1rem;
        }

        .hero-title {
          font-size: 1.72rem;
        }
      }
    </style>

    <!-- JavaScript Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const outputs = document.querySelectorAll(".markdown-output");
        outputs.forEach(function (el) {
          const raw = el.textContent || "";
          if (!raw.trim()) {
            return;
          }

          const html = marked.parse(raw, {
            breaks: true,
            gfm: true,
          });

          el.innerHTML = DOMPurify.sanitize(html);
        });
      });
    </script>

  </body>
